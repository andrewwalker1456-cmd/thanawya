# ============================================================
# Thanaweya Amma Bot — Configuration
# ============================================================

bot:
  token: ""  # Set via BOT_TOKEN environment variable
  admin_ids: [373303307]  # Set via ADMIN_IDS env var (comma-separated Telegram user IDs)

server:
  host: "0.0.0.0"
  port: 8080

data:
  upload_dir: "data/uploads"
  cache_dir: "data/cache"
  source_file: ""  # Set via SOURCE_FILE env var, or leave empty to use upload

search:
  normalize_teh: false  # Convert ة -> ه during normalization
  max_name_results: 10

rate_limit:
  max_requests_per_minute: 30
  max_requests_per_hour: 200
  burst: 5

pdf:
  font_path: "../fonts/NotoNaskhArabic.ttf"
  fallback_font_path: "/usr/share/fonts/truetype/dejavu/DejaVuSans.ttf"
  paper_size: "A4"

logging:
  level: "INFO"
  file: "logs/bot.log"
  max_size_mb: 50
  backup_count: 5

payment:
  enabled: false
  price_egp: 20
  provider: "ammerpay"
  ammerpay_test_key: "6073714100:TEST:TG_vglHkQAXp5avwAEm28PmKD4A"
  ammerpay_live_key: "5775769170:LIVE:TG_FShb1q6sdCB4br6s55zYlCkA"
  ammerpay_use_test: true  # Set to false for production
  free_searches_per_user: 0  # Number of free searches before payment required
  admin_free: true  # Admins bypass payment

admin:
  max_upload_size_mb: 100